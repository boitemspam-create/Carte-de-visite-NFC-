<style>
  :root {
    color-scheme: light dark;
    --bg: #f1f1f2;
    --surface: #ffffff;
    --ink: #17171a;
    --muted: #6a6a72;
    --line: rgba(23, 23, 26, .09);
    --ring: rgba(0, 0, 0, .08);
    --accent: #ff5a00;
    --on-accent: #17171a;
    --brand: #c23f00;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0f;
      --surface: #18181b;
      --ink: #f4f4f5;
      --muted: #a1a1a9;
      --line: rgba(255, 255, 255, .09);
      --ring: rgba(255, 255, 255, .16);
      --brand: #ff8a4d;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: min(100% - 40px, 420px);
    margin-inline: auto;
    padding: max(28px, env(safe-area-inset-top)) 0 max(36px, env(safe-area-inset-bottom));
  }

  /* Carte à retourner */
  .card {
    display: block;
    width: 100%;
    aspect-ratio: 85 / 55;
    padding: 0;
    border: 0;
    background: none;
    border-radius: var(--radius);
    perspective: 1400px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: arrive .6s cubic-bezier(.2, .7, .2, 1) both;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2, .7, .2, 1);
  }
  .card[aria-pressed="true"] .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: var(--radius);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 0 0 1px var(--ring), 0 26px 40px -24px rgba(0, 0, 0, .5);
  }
  .face img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .verso { transform: rotateY(180deg); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

  .hint {
    margin: 14px 0 0;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }

  /* Identité */
  .identity { margin: 36px 0 28px; }
  h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -.025em;
  }
  .brand { margin: 6px 0 0; font-size: 18px; font-weight: 600; color: var(--brand); letter-spacing: .01em; }
  .place { margin: 2px 0 0; font-size: 15px; color: var(--muted); }

  /* Actions */
  .primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 56px;
    padding: 0 20px;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--on-accent);
    font-size: 17px;
    font-weight: 650;
    text-decoration: none;
    transition: transform .15s ease, filter .15s ease;
  }
  .primary:active { transform: scale(.98); filter: brightness(.95); }

  .links {
    list-style: none;
    margin: 12px 0 0;
    padding: 0;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 0 0 1px var(--line);
    overflow: hidden;
  }
  .links li + li { border-top: 1px solid var(--line); }
  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 64px;
    padding: 10px 18px;
    color: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .row:active { background: var(--line); }
  .row svg { flex: none; width: 22px; height: 22px; color: var(--muted); }
  .row .label { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; }
  .row .value { display: block; font-size: 14px; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }

  :is(.primary, .row, .share):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .share {
    display: block;
    margin: 22px auto 0;
    padding: 8px 14px;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
  }
  .note { margin: 18px 0 0; text-align: center; font-size: 13px; color: var(--muted); }

  @keyframes arrive { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .card-inner { transition: none; }
    .primary { transition: none; }
  }
</style>
</head>
